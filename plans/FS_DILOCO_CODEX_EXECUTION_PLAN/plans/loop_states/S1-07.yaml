  handoff:
    proven_facts:
    - The byte-weighted midpoint scheduler deterministically derives one due offset per fragment under unified H and exposes exact rational sum_f fragment_bytes_f over H_f accounting for future nonuniform intervals.
    - LearnerRuntime invokes snapshot observers only after optimizer scheduler and zero-grad completion and active-gradient capture fails before sequence reservation.
    - Each immutable proposal contains only one complete target fragment in little-endian fp32 and binds actual bootstrapped FragmentGlobalState content identity local steps processed tokens snapshot step sequence and payload checksum.
    - One worker per fragment permits one in-flight plus one latest-wins pending snapshot and keeps resident telemetry bounded by 3F independent of publication history.
    - Old-base in-flight and new-base pending proposals coexist without metadata rewriting and restart restores the highest reserved sequence without reuse.
    - Injected writer failure clears in-flight and pending states marks the pending snapshot abandoned and reaches drain and close without deadlock.
    - Formal job 2385625.opbs exits zero in 41 seconds on distinct hosts mg0017 and mg0018 with only the writer allocating GPU memory and no application MPI communication.
    - The slow fragment-zero publication begins before learner training returns remains gated until after return and therefore proves the learner does not wait for filesystem publication reader syncer or quorum.
    - Twenty safe-boundary captures yield seventeen publications and three replacements with one pending and one in-flight maximum for every fragment and final resident trace state 4 of 12.
    - The remote reader performs 273 fixed-slot polls with no partial data or sequence regression and all four final parameter base token step and checksum chains match capture and writer records.
    - The full 150-test Stage 1 suite passes the 28-file package is validator-admissible all packaged and PBS stderr files are empty and the independent Checker returns PASS.

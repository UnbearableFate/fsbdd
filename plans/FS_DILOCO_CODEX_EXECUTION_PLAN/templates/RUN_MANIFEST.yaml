assets:
  offline_only: true
  model:
    repository: openai-community/gpt2
    revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
    weight_files_sha256: <sha-or-map>
  tokenizer:
    repository: openai-community/gpt2
    revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
    files_sha256: <sha-or-map>
  dataset:
    repository: Salesforce/wikitext
    revision: b08601e04326c79dfdd32d625aee71d232d685c3
    config_name: wikitext-2-raw-v1
    source_files_sha256: <sha-or-map>
    tokenized_split_and_shard_sha256: <sha-or-map>
    split_block_counts: <map>
    expected_train_blocks_per_learner: [590, 590, 590, 590, 590, 590, 589, 589]
topology:
  learners: 8
  syncers: 1
  learner_gpus_per_node: 1
  syncer_uses_gpu: false
  no_network_data_plane: true
training:
  framework: torch
  ecosystem: huggingface
  local_optimizer_step_interval_H: 50
  target_global_cycles: 10
  actual_global_cycles: null
  model_profile: gpt2-small-pretrained
  data_profile: wikitext2-raw-packed-512-8way
  sequence_length: 512
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  nominal_input_tokens_per_optimizer_step: 2048
  nominal_loss_target_tokens_per_optimizer_step: 2044
  precision: bf16
  optimizer: adamw-lr5e-5-constant
  learner_runtime_seed_base: 20260714
  dataloader_seed_base: 20261714
  fragment_count: <F>
  Q: <Q>
  Q_fresh: <Q_fresh>
  S_max: <0-or-1>
  lambda_s: <value>
  grace_seconds: <value>
  fragment_offsets: <integer-list-length-F>
  outer_optimizer: <fully-resolved-map>
gate:
  thresholds_frozen_at: <UTC>
  baseline_run_id: <run-or-null>
  runtime_budget_s: <integer>
  runtime_factor_limit: 1.5
  loss:
    finite_required: true
    minimum_points_per_learner: 200
    smoothing: rolling_median
    window_points: 20
    warmup_points: 20
    initial_fraction: 0.20
    final_fraction: 0.20
    max_final_over_initial: 0.99
    robust_slope_must_be_negative: true
  validation:
    split: validation
    initial_snapshot_loss: null
    final_snapshot_loss: null
    finite_required: true
    blocking_regression_threshold: null
    test_split_used: false
fault_or_overlay:
  type: none
  config: {}
outputs:
  evidence_index: <tracked-path>
  role_map: <path>
  resolved_config: <path>
  raw_logs: <path>
  raw_metrics: <path>
  storage_snapshot: <path>
  analysis: <path>
  checker_report: <path>
